upstream api_backend {
  server avanfinity-backend-candidate-wallet-toast:8080;
  keepalive 128;
  keepalive_requests 10000;
  keepalive_timeout 60s;
}

map $uri $seo_robots {
  default "noindex, nofollow, noarchive";
  /robots.txt "";
  /sitemap.xml "";
  ~^/register/?$ "";
  ~^/cdk/redeem/?$ "";
}

server {
  listen 8080;
  server_tokens off;
  # The published port is loopback-only in production. Docker's fixed gateway is
  # therefore the local TLS edge's trusted hop; the edge must overwrite XFF.
  set_real_ip_from 172.31.240.1/32;
  real_ip_header X-Forwarded-For;
  root /usr/share/nginx/html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json image/svg+xml text/css;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag $seo_robots always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # This container is an HTTP-only inner proxy. The TLS-terminating edge must
  # redirect HTTP to HTTPS and emit Strict-Transport-Security itself.
  location = /api/internal {
    return 404;
  }

  location ^~ /api/internal/ {
    return 404;
  }

  location = /api/ready {
    return 404;
  }

  location = /api/auth/telegram/callback {
    access_log off;
    error_log /dev/null emerg;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
  }

  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 64k;

    location ^~ /api/x-direct/ {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location ^~ /api/v1/x-direct/ {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location ^~ /api/public/x-cdk/ {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location = /api/admin/x-direct/session {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location ^~ /api/tg-direct/ {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location ^~ /api/v1/tg-direct/ {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location ^~ /api/public/tg-cdk/ {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location = /api/admin/tg-direct/session {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location = /api/gpt-direct/preflight {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location = /api/v1/gpt-direct/preflight {
      proxy_pass http://api_backend;
      proxy_read_timeout 400s;
    }

    location = /api/cards/open {
      proxy_pass http://api_backend;
      proxy_read_timeout 90s;
    }

    location = /api/v1/cards/open {
      proxy_pass http://api_backend;
      proxy_read_timeout 90s;
    }
  }

  location / {
    expires -1;
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
}
